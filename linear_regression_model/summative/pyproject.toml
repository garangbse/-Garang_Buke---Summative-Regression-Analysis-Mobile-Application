[project]
name = "linear-regression-model"
version = "1.0.0"
description = "Predicting monthly employment earnings among young Rwandans (ALU ML summative)"
readme = "../README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "scikit-learn==1.6.1",   # must match the version used in Colab to train best_model.pkl
    "joblib>=1.4",
]

# Extra tools for the notebook and for local testing. They are NOT installed on Render
# because "uv export" only exports the main dependencies.
[dependency-groups]
notebook = ["matplotlib>=3.8", "seaborn>=0.13", "jupyter>=1.0"]
test = ["httpx>=0.27", "pytest>=8.0"]

[tool.uv]
package = false        # this is an application, not an installable library
default-groups = []    # keep the default environment (and Render) to the API dependencies only
